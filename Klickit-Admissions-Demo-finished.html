  ${selectField({ id: 'cf-step', label: 'Form step', value: d.step, placeholder: null, options: [['1', 'Child details'], ['2', 'Parent & family']], attrs: 'data-bind="modalField" data-key="step"' })}
  ${d.type === 'select' ? inputField({ id: 'cf-opts', label: 'Options, separated by commas', value: d.options, required: true, full: true, attrs: 'data-bind="modalField" data-key="options"' }) : ''}
  <label class="check full"><input type="checkbox" id="cf-req" ${d.required ? 'checked' : ''} data-bind="modalField" data-key="required"><span>Required</span></label></div>`,
  foot: `${btn('Cancel', 'data-act="closeModal"')}<button type="submit" class="btn btn-primary">Add field</button>` });
BINDS.modalFieldR = (el) => { ui.modal.data[el.dataset.key] = el.value; renderModal(); };
FORMS.addCustom = () => {
  const d = ui.modal.data; const e = {};
  if (!d.label.trim()) e['cf-label'] = 'Enter the question parents will see.';
  const opts = d.options.split(',').map((x) => x.trim()).filter(Boolean);
  if (d.type === 'select' && opts.length < 2) e['cf-opts'] = 'Enter at least two options.';
  ui.errors = e; if (Object.keys(e).length) { renderModal(); return; }
  const g = gs(d.g); g.customFields = g.customFields || [];
  g.customFields.push({ key: 'cf_' + nextSeq('cf'), label: d.label.trim(), type: d.type, options: d.type === 'select' ? opts : undefined, step: Number(d.step), enabled: true, required: !!d.required, custom: true });
  closeModal(); cfgSaved(d.g, `field “${d.label.trim()}” added`);
};
ACTS.addDoc = (el) => openModal('addDoc', { g: el.dataset.g, label: '', required: true });
MODALS.addDoc = (d) => ({ title: `Add a document · ${esc(gradeName(d.g))}`, form: 'addDoc', body: `${inputField({ id: 'ad-label', label: 'Document name', value: d.label, required: true, attrs: 'data-bind="modalField" data-key="label" placeholder="For example: Sibling enrollment letter"' })}<label class="check"><input type="checkbox" id="ad-req" ${d.required ? 'checked' : ''} data-bind="modalField" data-key="required"><span>Required</span></label>`, foot: `${btn('Cancel', 'data-act="closeModal"')}<button type="submit" class="btn btn-primary">Add document</button>` });
FORMS.addDoc = () => { const d = ui.modal.data; if (!d.label.trim()) { ui.errors['ad-label'] = 'Enter the document name.'; renderModal(); return; } gs(d.g).documents.push({ key: 'doc_' + nextSeq('cf'), label: d.label.trim(), enabled: true, required: !!d.required, custom: true }); closeModal(); cfgSaved(d.g, `document “${d.label.trim()}” added`); };

/* ---------- fees & offer rules ---------- */
ADMIN_VIEWS['a-fees'] = () => {
  const used = [...new Set(SC().flatMap((c) => c.grades))];
  const d = ui.feeDraft || (ui.feeDraft = { fees: Object.fromEntries(used.map((g) => [g, { applicationFee: gs(g).applicationFee, downPayment: gs(g).downPayment }])), rules: { offerValidityDays: aRules().offerValidityDays, warnDays: aRules().warnDays, autoExpire: aRules().autoExpire } });
  return { title: 'Fees & offer rules', crumb: 'Fees & offer rules', html: `${pageHead('Fees and offer rules', 'Amounts are in EGP and collected through Klickit Pay. The application fee and the down payment are always separate transactions.')}
    ${errorSummary()}
    <form class="stack" data-form="saveFees" novalidate>
      <section class="card"><div class="card-head"><h2>Fees per grade</h2>${demoPill()}</div><div class="table-wrap"><table class="tbl"><thead><tr><th>Grade</th><th class="r">Application fee (EGP)</th><th class="r">Down payment on offer (EGP)</th><th class="r">Active offers</th></tr></thead><tbody>
        ${used.map((g) => `<tr><td class="cell-main">${esc(gradeName(g))}</td><td class="r"><input class="input input-sm num" style="width:130px;text-align:end" type="number" min="0" step="50" id="fee-app-${g}" aria-label="${esc(gradeName(g))} application fee" value="${esc(d.fees[g].applicationFee)}" data-bind="fee" data-g="${g}" data-key="applicationFee" ${invalid('fee_app_' + g)}>${err('fee_app_' + g)}</td>
          <td class="r"><input class="input input-sm num" style="width:130px;text-align:end" type="number" min="0" step="500" id="fee-dp-${g}" aria-label="${esc(gradeName(g))} down payment" value="${esc(d.fees[g].downPayment)}" data-bind="fee" data-g="${g}" data-key="downPayment" ${invalid('fee_dp_' + g)}>${err('fee_dp_' + g)}</td><td class="r num">${SO().filter((o) => o.gradeId === g && (o.status === 'sent' || o.status === 'accepted')).length}</td></tr>`).join('')}
      </tbody></table></div><div class="card-body"><p class="xs muted">New amounts apply to new applications and new offers. Offers already issued keep the down payment stated in them.</p></div></section>
      <section class="card"><div class="card-head"><h2>Offer payment deadline rules</h2>${assume()}</div><div class="card-body form-grid">
        ${inputField({ id: 'r-valid', label: 'Default offer validity (days)', type: 'number', value: d.rules.offerValidityDays, required: true, errKey: 'r-valid', attrs: 'min="1" max="30" data-bind="feeRule" data-key="offerValidityDays"', hint: 'The deadline proposed when an offer is issued. Staff can change it per offer.' })}
        ${inputField({ id: 'r-warn', label: 'Deadline reminder (days before)', type: 'number', value: d.rules.warnDays, required: true, errKey: 'r-warn', attrs: 'min="1" max="7" data-bind="feeRule" data-key="warnDays"', hint: 'Parents get one in-app reminder, and the offer is flagged for staff.' })}
        <label class="check full"><input type="checkbox" id="r-auto" ${d.rules.autoExpire ? 'checked' : ''} data-bind="feeRule" data-key="autoExpire"><span><b>Expire unpaid offers automatically at the deadline</b><br><span class="small muted">When off, overdue offers are flagged and staff expire them manually. Either way, expiry releases the held seat.</span></span></label>
      </div></section>
      <section class="card"><div class="card-head"><h2>Open questions for Klickit</h2>${badge({ label: 'Not modeled', tone: 'neutral', icon: 'info' })}</div><div class="card-body stack-sm small">
        <div class="row" style="align-items:flex-start">${ic('info')}<span><b>Is the application fee refundable?</b> The prototype records the fee only. No refund behavior is assumed.</span></div>
        <div class="row" style="align-items:flex-start">${ic('info')}<span><b>Is the down payment deducted from first-term tuition?</b> Tuition collection is out of scope; the prototype records the down payment as its own transaction.</span></div></div></section>
      <div class="row" style="justify-content:flex-end">${btn('Discard changes', 'data-act="discardFees"')}<button type="submit" class="btn btn-primary" id="fees-save">Save fees and rules</button></div>
    </form>` };
};
BINDS.fee = (el) => { ui.feeDraft.fees[el.dataset.g][el.dataset.key] = el.value; };
BINDS.feeRule = (el) => { ui.feeDraft.rules[el.dataset.key] = el.type === 'checkbox' ? el.checked : el.value; };
ACTS.discardFees = () => { ui.feeDraft = null; ui.errors = {}; render(); };
FORMS.saveFees = () => {
  const d = ui.feeDraft; const e = {};
  const money = (v) => /^\d+$/.test(String(v).trim()) && Number(v) <= 1000000;
  Object.entries(d.fees).forEach(([g, f]) => {
    if (!money(f.applicationFee) || Number(f.applicationFee) < 1) e['fee_app_' + g] = 'Enter a whole amount between 1 and 1,000,000.';
    if (!money(f.downPayment) || Number(f.downPayment) < 1) e['fee_dp_' + g] = 'Enter a whole amount between 1 and 1,000,000.';
  });
  const v = Number(d.rules.offerValidityDays), w = Number(d.rules.warnDays);
  if (!Number.isInteger(v) || v < 1 || v > 30) e['r-valid'] = 'Enter a number of days from 1 to 30.';
  if (!Number.isInteger(w) || w < 1 || w > 7) e['r-warn'] = 'Enter a number of days from 1 to 7.';
  else if (!e['r-valid'] && w >= v) e['r-warn'] = 'The reminder must come before the end of the validity period.';
  ui.errors = e; if (Object.keys(e).length) { render(); return; }
  Object.entries(d.fees).forEach(([g, f]) => { gs(g).applicationFee = Number(f.applicationFee); gs(g).downPayment = Number(f.downPayment); });
  Object.assign(aRules(), { offerValidityDays: v, warnDays: w, autoExpire: !!d.rules.autoExpire });
  log('Fees and offer rules updated', { kind: 'config' });
  const n = runScheduler(); save(); ui.feeDraft = null; render();
  toast(`Fees and offer rules saved.${n ? ` ${n} overdue offer${n > 1 ? 's' : ''} expired.` : ''}`);
};

/* ---------- school settings ---------- */
ADMIN_VIEWS['a-settings'] = () => {
  const sc = mySchool();
  const s = ui.schoolDraft || (ui.schoolDraft = { adminName: sc.admin.name, phone: sc.phone || '' });
  const r = aRules();
  const radio = (name, val, cur, title, text) => `<label class="option-card"><input type="radio" name="${name}" value="${val}" ${cur === val ? 'checked' : ''} data-bind="rule" data-key="${name}"><span><span class="cell-main">${title}</span><br><span class="small muted">${text}</span></span></label>`;
  return { title: 'School settings', crumb: 'School settings', html: `${pageHead('School settings', `Profile and admissions rules for ${esc(sc.name)} only. Other schools on Klickit keep their own settings. Rules marked as demo assumptions are proposals to confirm with Klickit.`)}
    ${errorSummary()}
    <form class="card" data-form="saveSchool" novalidate><div class="card-head"><h2>School account</h2>${demoPill()}</div><div class="card-body stack">
      ${kv([['School', esc(sc.name)], ['Initials', esc(sc.initials)], ['Area', esc(sc.area)], ['Admin sign-in email', `<span class="mono">${esc(sc.adminEmail)}</span>`]])}
      <p class="xs muted">The sign-in email is unique to this school and ends in .edu. Only Klickit can change it.</p>
      <div class="form-grid">
      ${inputField({ id: 'sc-admin', label: 'Admissions officer name', value: s.adminName, required: true, attrs: 'data-bind="school" data-key="adminName"' })}
      ${inputField({ id: 'sc-phone', label: 'Admissions phone (shown to parents)', type: 'tel', value: s.phone, attrs: 'data-bind="school" data-key="phone"', hint: 'Optional' })}
    </div></div><div class="card-foot"><button type="submit" class="btn btn-primary">Save profile</button></div></form>
    <section class="card"><div class="card-head"><h2>Admissions rules</h2>${assume()}</div><div class="card-body stack">
      <fieldset class="stack-sm" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:6px">When is a seat held?</legend>
        ${radio('seatReservation', 'on_offer', r.seatReservation, 'When the offer is issued (proposed)', 'Each active offer holds a seat until it is paid or expires. Offers can’t exceed capacity.')}
        ${radio('seatReservation', 'on_payment', r.seatReservation, 'Only when the down payment is paid', 'More offers can be out than seats; the first families to pay secure the seats. Payment is blocked once the grade is full.')}</fieldset>
      <fieldset class="stack-sm" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:6px">Waitlist order</legend>
        ${radio('waitlistPolicy', 'fifo', r.waitlistPolicy, 'First in, first out (proposed)', 'The earliest waitlisted applicant is offered the next seat. Staff can reorder with a recorded reason.')}
        ${radio('waitlistPolicy', 'manual', r.waitlistPolicy, 'Staff choose', 'Any waitlisted applicant can be offered a free seat, with a reason recorded.')}</fieldset>
      <label class="check"><input type="checkbox" id="rule-auto" ${r.autoPromote ? 'checked' : ''} data-bind="rule" data-key="autoPromote"><span><b>Offer released seats to the waitlist automatically</b><br><span class="small muted">Off by default: staff confirm each promotion. When on, an expired offer’s seat goes straight to the next applicant in FIFO order.</span></span></label>
      <fieldset class="stack-sm" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:6px">Enrollment</legend>
        ${radio('enrollment', 'auto', r.enrollment, 'Create the student record automatically (proposed)', 'As soon as the offer is accepted and the down payment succeeds.')}
        ${radio('enrollment', 'manual', r.enrollment, 'Staff confirm enrollment', 'Paid applicants wait in “Paid · awaiting enrollment” until confirmed.')}</fieldset>
    </div></section>
    <section class="card"><div class="card-head"><h2>Language</h2>${badge({ label: 'Open question', tone: 'neutral', icon: 'info' })}</div><div class="card-body stack-sm">
      <p class="small">The prototype is in English. Arabic support is an open question for Klickit. Layouts use direction-neutral spacing so a right-to-left version can be added later.</p>
      <label class="check"><input type="checkbox" id="rtl-check" ${st.dir === 'rtl' ? 'checked' : ''} data-bind="rtl"><span>Preview right-to-left layout (layout check only; text stays in English)</span></label></div></section>
    <section class="card"><div class="card-head"><h2>Demo data</h2></div><div class="card-body row-between"><p class="small muted">Restore the original sample schools, families, applications and settings for everyone using this browser.</p>${btn(`${ic('refresh')}Reset demo data`, 'data-act="resetDemo"', 'btn-danger')}</div></section>` };
};
BINDS.school = (el) => { ui.schoolDraft[el.dataset.key] = el.value; };
FORMS.saveSchool = () => {
  const s = ui.schoolDraft; const e = {};
  if (!s.adminName.trim()) e['sc-admin'] = 'Enter the admissions officer’s name.';
  if (s.phone.trim() && !/^[+\d][\d\s-]{6,}$/.test(s.phone.trim())) e['sc-phone'] = 'Enter a phone number using digits, spaces or +, for example +20 2 1234 5678.';
  ui.errors = e; if (Object.keys(e).length) { render(); return; }
  const sc = mySchool(); sc.admin.name = s.adminName.trim(); sc.phone = s.phone.trim();
  log('School profile updated', { kind: 'config' }); save(); ui.schoolDraft = null; render(); toast('School profile saved.');
};
BINDS.rule = (el) => {
  const k = el.dataset.key; const v = el.type === 'checkbox' ? el.checked : el.value;
  const apply = () => {
    aRules()[k] = v;
    if (k === 'seatReservation') SO().filter((o) => o.status === 'sent' || o.status === 'accepted').forEach((o) => { o.seatReservationStatus = v === 'on_offer' ? 'reserved' : 'not_held'; });
    let promoted = 0;
    if (k === 'autoPromote' && v) SC().forEach((c) => c.grades.forEach((g) => { promoted += autoPromote(c.id, g); }));
    log(`Admissions rule changed: ${k} → ${v}`, { kind: 'config' }); save(); render(); toast(`Rule updated.${promoted ? ` ${promoted} waitlisted applicant${promoted > 1 ? 's' : ''} offered a seat.` : ''}`);
  };
  if (k === 'seatReservation' || (k === 'autoPromote' && v)) {
    confirmDialog({ title: 'Change this admissions rule?', confirmLabel: 'Change rule', body: k === 'seatReservation' ? `<p>${v === 'on_offer' ? 'Active offers will each hold a seat again. If more offers are out than seats, the affected grade shows as over-allocated until offers resolve.' : 'Active offers will stop holding seats. Seats are confirmed only when the down payment is paid.'}</p>` : '<p>Any grade with a free seat and a waitlist will immediately offer the seat to the next applicant in FIFO order.</p>', onConfirm: () => { closeModal(); apply(); return false; } });
    render(); return;
  }
  apply();
};
BINDS.rtl = (el) => { st.dir = el.checked ? 'rtl' : 'ltr'; save(); render(); };

/* =========================================================================
   main.js: boot
   ========================================================================= */
function boot() {
  st = load() || seed();
  if (st.session.role === 'admin') resetAdminUi(st.session.schoolId);
  runScheduler();
  save();
  bindEvents();
  render({ nav: true });
}
boot();

</script>
</body></html>
