<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Klickit Admissions</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body><title>Klickit Admissions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Klickit Admissions demo prototype: admissions management for schools on Klickit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600&display=swap">
<style>
/* Layout concept: admin = fixed navy sidebar + light gray work canvas with dense, scannable tables;
   parent = single-column mobile-first app with a bottom tab bar. Logical (inline/block) properties throughout so an RTL layout can be added later. */
:root {
  --navy: #0d2240;
  --navy-2: #13305a;
  --ink: #0f1b2d;
  --ink-2: #33415a;
  --muted: #5b6880;
  --muted-2: #7d899e;
  --blue: #1f5fd1;
  --blue-strong: #184ead;
  --blue-soft: #e9f0fd;
  --blue-line: #c7d8f7;
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --surface-3: #eef2f7;
  --line: #dde3ec;
  --line-2: #e8ecf2;
  --focus: #3b82f6;
  --on-navy: #e8eefa;
  --on-navy-muted: #9fb0cc;
  --on-blue: #ffffff;
  --shadow: 0 1px 2px rgba(15, 27, 45, .06), 0 1px 1px rgba(15, 27, 45, .04);
  --shadow-lg: 0 12px 32px rgba(15, 27, 45, .16), 0 2px 6px rgba(15, 27, 45, .08);
  --overlay: rgba(9, 18, 33, .48);

  /* semantic status (separate from the blue accent) */
  --good: #0c6b36; --good-bg: #e2f3e8; --good-line: #b6dfc4; --good-mark: #1a9a52;
  --warn: #7a4f00; --warn-bg: #fff2d1; --warn-line: #f0d48c; --warn-mark: #e3a008;
  --serious: #94400f; --serious-bg: #fde9dc; --serious-line: #f3c3a4; --serious-mark: #e0763d;
  --crit: #a61d1d; --crit-bg: #fce4e4; --crit-line: #f1b9b9; --crit-mark: #d03b3b;
  --info: #1d4fa8; --info-bg: #e7effd; --info-line: #c2d5f6;
  --violet: #4b3aa8; --violet-bg: #eeeafd; --violet-line: #d3cbf5;
  --neutral: #44516a; --neutral-bg: #edf0f5; --neutral-line: #d6dce6;

  /* chart series (validated reference categorical slots 1-3; ordinal blue ramp) */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --r1: #0d366b; --r2: #184f95; --r3: #256abf; --r4: #3987e5; --r5: #6da7ec; --r6: #86b6ef;
  --seat-enrolled: #0d366b; --seat-reserved: #6da7ec; --seat-free: #e3e9f2;
  --demobar: #0a1a31; --demobar-ink: #cfdaee;

  --font-display: "Readex Pro", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --sidebar-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #07111f; --navy-2: #0f223f;
    --ink: #e6ecf6; --ink-2: #c4cee0; --muted: #9eabc1; --muted-2: #7f8ca4;
    --blue: #5b8ff0; --blue-strong: #7aa5f5; --blue-soft: #16294a; --blue-line: #284777;
    --bg: #0a1322; --surface: #101c30; --surface-2: #14223a; --surface-3: #1a2a45; --line: #24375a; --line-2: #1e2f4d;
    --focus: #7aa5f5; --on-navy: #e6ecf6; --on-navy-muted: #8e9fbd; --on-blue: #06101f;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
    --overlay: rgba(2, 6, 14, .66);
    --good: #7fd8a3; --good-bg: #0f2e20; --good-line: #1f5a3c; --good-mark: #2fb46a;
    --warn: #f3cd6f; --warn-bg: #33270b; --warn-line: #5e4815; --warn-mark: #e3a008;
    --serious: #f4ad84; --serious-bg: #3a1f10; --serious-line: #6a3a1d; --serious-mark: #e0763d;
    --crit: #f59c9c; --crit-bg: #3a1515; --crit-line: #6b2626; --crit-mark: #e66767;
    --info: #9cbdf6; --info-bg: #142a4d; --info-line: #24467c;
    --violet: #bdb2f5; --violet-bg: #231d48; --violet-line: #3b3277;
    --neutral: #b7c2d5; --neutral-bg: #1b2840; --neutral-line: #2b3c5c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --r1: #9ec5f4; --r2: #6da7ec; --r3: #3987e5; --r4: #2a78d6; --r5: #1c5cab; --r6: #184f95;
    --seat-enrolled: #86b6ef; --seat-reserved: #2a6bc2; --seat-free: #1d2d4a;
    --demobar: #040b16; --demobar-ink: #b9c6dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #07111f; --navy-2: #0f223f;
  --ink: #e6ecf6; --ink-2: #c4cee0; --muted: #9eabc1; --muted-2: #7f8ca4;
  --blue: #5b8ff0; --blue-strong: #7aa5f5; --blue-soft: #16294a; --blue-line: #284777;
  --bg: #0a1322; --surface: #101c30; --surface-2: #14223a; --surface-3: #1a2a45; --line: #24375a; --line-2: #1e2f4d;
  --focus: #7aa5f5; --on-navy: #e6ecf6; --on-navy-muted: #8e9fbd; --on-blue: #06101f;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
  --overlay: rgba(2, 6, 14, .66);
  --good: #7fd8a3; --good-bg: #0f2e20; --good-line: #1f5a3c; --good-mark: #2fb46a;
  --warn: #f3cd6f; --warn-bg: #33270b; --warn-line: #5e4815; --warn-mark: #e3a008;
  --serious: #f4ad84; --serious-bg: #3a1f10; --serious-line: #6a3a1d; --serious-mark: #e0763d;
  --crit: #f59c9c; --crit-bg: #3a1515; --crit-line: #6b2626; --crit-mark: #e66767;
  --info: #9cbdf6; --info-bg: #142a4d; --info-line: #24467c;
  --violet: #bdb2f5; --violet-bg: #231d48; --violet-line: #3b3277;
  --neutral: #b7c2d5; --neutral-bg: #1b2840; --neutral-line: #2b3c5c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --r1: #9ec5f4; --r2: #6da7ec; --r3: #3987e5; --r4: #2a78d6; --r5: #1c5cab; --r6: #184f95;
  --seat-enrolled: #86b6ef; --seat-reserved: #2a6bc2; --seat-free: #1d2d4a;
  --demobar: #040b16; --demobar-ink: #b9c6dc;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14.5px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--demobar); }
h1, h2, h3, h4 { font-family: var(--font-display); color: var(--ink); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; }
h2 { font-size: 1.15rem; font-weight: 600; line-height: 1.3; }
h3 { font-size: 1rem; font-weight: 600; line-height: 1.35; }
h4 { font-size: .9rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-size: .92em; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.xs { font-size: .78rem; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.stack-lg { display: flex; flex-direction: column; gap: 24px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { width: 15px; height: 15px; }
.icon-lg { width: 24px; height: 24px; }

/* ---------- demo bar ---------- */
.demobar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: var(--demobar); color: var(--demobar-ink);
  font-size: .8rem;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; justify-content: space-between;
}
.demobar .tag { background: #f5c451; color: #1d1400; font-weight: 700; font-size: .68rem; letter-spacing: .08em; padding: 2px 7px; border-radius: 4px; }
.demobar .clock { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.demobar button {
  background: transparent; border: 1px solid rgba(207, 218, 238, .28); color: var(--demobar-ink);
  border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: .78rem; display: inline-flex; align-items: center; gap: 5px;
}
.demobar button:hover { background: rgba(255,255,255,.08); }
.demobar .grp { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
@media (max-width: 720px) { .demobar .hide-sm { display: none; } }

/* ---------- buttons, inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 8px 14px; font-weight: 500; cursor: pointer; text-decoration: none;
  line-height: 1.25; min-height: 38px; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--muted-2); }
.btn-primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn-primary:hover { background: var(--blue-strong); border-color: var(--blue-strong); }
.btn-danger { color: var(--crit); border-color: var(--crit-line); }
.btn-danger:hover { background: var(--crit-bg); border-color: var(--crit-mark); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface-3); border-color: transparent; }
.btn-sm { padding: 5px 10px; min-height: 30px; font-size: .84rem; border-radius: 7px; }
.btn-lg { padding: 11px 18px; min-height: 46px; font-size: 1rem; }
.btn-block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn .spinner { width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.linkbtn { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font-weight: 500; text-align: start; }
.linkbtn:hover { text-decoration: underline; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .label { font-weight: 500; font-size: .88rem; color: var(--ink-2); }
.field .hint { font-size: .8rem; color: var(--muted); }
.req { color: var(--crit); margin-inline-start: 2px; }
.input, .select, .textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 9px 11px; min-height: 40px; color: var(--ink);
}
.textarea { min-height: 84px; resize: vertical; }
.input:hover, .select:hover, .textarea:hover { border-color: var(--muted-2); }
.input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--crit-mark); }
.input-sm { min-height: 32px; padding: 5px 9px; font-size: .88rem; }
.err { color: var(--crit); font-size: .82rem; display: flex; gap: 6px; align-items: flex-start; }
.err .icon { width: 15px; height: 15px; margin-top: 2px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: minmax(0,1fr); } }
.check { display: inline-flex; align-items: flex-start; gap: 9px; cursor: pointer; }
.check input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--blue); flex: none; }
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
label.switch > input[type="checkbox"] { appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
label.switch > input[type="checkbox"]::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
label.switch > input[type="checkbox"]:checked { background: var(--blue); }
label.switch > input[type="checkbox"]:checked::after { transform: translateX(16px); }
[dir="rtl"] label.switch > input[type="checkbox"]:checked::after { transform: translateX(-16px); }
label.switch > input[type="checkbox"]:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: var(--surface-2); gap: 3px; flex-wrap: wrap; }
.seg button, .seg label { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg [aria-pressed="true"], .seg label:has(input:checked) { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--focus); }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); min-width: 0; }
.card-pad { padding: 20px; }
.card-head { padding: 16px 20px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-body { padding: 18px 20px; }
.card-foot { padding: 12px 20px; border-top: 1px solid var(--line-2); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.panel { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 14px 16px; }
.callout { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--r-md); padding: 12px 14px; border: 1px solid var(--info-line); background: var(--info-bg); color: var(--info); font-size: .9rem; }
.callout .icon { margin-top: 2px; }
.callout strong { color: inherit; }
.callout.warn { border-color: var(--warn-line); background: var(--warn-bg); color: var(--warn); }
.callout.crit { border-color: var(--crit-line); background: var(--crit-bg); color: var(--crit); }
.callout.good { border-color: var(--good-line); background: var(--good-bg); color: var(--good); }
.callout.neutral { border-color: var(--neutral-line); background: var(--neutral-bg); color: var(--neutral); }
.assume { display: inline-flex; align-items: center; gap: 5px; font-size: .7rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--violet); background: var(--violet-bg); border: 1px dashed var(--violet-line); padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.demo-pill { display: inline-flex; align-items: center; font-size: .68rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
.divider { height: 1px; background: var(--line-2); border: 0; margin: 0; }
.dl { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr); gap: 9px 16px; font-size: .92rem; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 480px) { .dl { grid-template-columns: minmax(0,1fr); gap: 2px 0; } .dl dd { margin-bottom: 8px; } }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; line-height: 1.3; }
.badge .icon { width: 13px; height: 13px; stroke-width: 2.2; }
.t-good { color: var(--good); background: var(--good-bg); border-color: var(--good-line); }
.t-warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.t-serious { color: var(--serious); background: var(--serious-bg); border-color: var(--serious-line); }
.t-crit { color: var(--crit); background: var(--crit-bg); border-color: var(--crit-line); }
.t-info { color: var(--info); background: var(--info-bg); border-color: var(--info-line); }
.t-violet { color: var(--violet); background: var(--violet-bg); border-color: var(--violet-line); }
.t-neutral { color: var(--neutral); background: var(--neutral-bg); border-color: var(--neutral-line); }
.t-solid { color: #fff; background: var(--good-mark); border-color: var(--good-mark); }
:root[data-theme="dark"] .t-solid { color: #04140b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .t-solid { color: #04140b; } }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: start; font-weight: 600; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl tbody tr.clickable:hover td { background: var(--surface-2); }
.tbl tbody tr.selected td { background: var(--blue-soft); }
.tbl .r { text-align: end; }
.tbl input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--blue); }
.cell-main { font-weight: 600; color: var(--ink); }
.cell-sub { font-size: .8rem; color: var(--muted); }

/* ---------- modal / toast ---------- */
.modal-root { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); background: var(--overlay); }
.modal { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); width: min(560px, 100%); max-height: min(88vh, 860px); display: flex; flex-direction: column; border: 1px solid var(--line); }
.modal.wide { width: min(760px, 100%); }
.modal-head { padding: 18px 22px 12px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.modal-body { padding: 4px 22px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.toasts { position: fixed; z-index: 120; inset-inline-end: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; background: var(--ink); color: var(--surface); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow-lg); font-size: .9rem; animation: toastIn .18s ease-out; }
.toast .icon { margin-top: 1px; }
.toast.good .icon { color: #5fd38f; } .toast.crit .icon { color: #ff9a9a; } .toast.warn .icon { color: #f5c451; }
:root[data-theme="dark"] .toast.good .icon { color: var(--good-mark); }
@keyframes toastIn { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
.tip { position: fixed; z-index: 130; pointer-events: none; background: var(--ink); color: var(--surface); font-size: .8rem; padding: 6px 9px; border-radius: 7px; box-shadow: var(--shadow-lg); max-width: 260px; }

/* ---------- welcome ---------- */

/* ---------- timeline / steps ---------- */

.ms.current { color: var(--ink); font-weight: 600; }

.stepper { display: flex; gap: 6px; }

/* ---------- parent shell ---------- */

.p-main { flex: 1; width: 100%; max-width: 980px; margin: 0 auto; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }

@media (max-width: 760px) {

  .p-tabbar { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); position: sticky; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .p-tabbar button { background: none; border: 0; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .68rem; color: var(--muted); cursor: pointer; position: relative; }
  .p-tabbar button[aria-current="page"] { color: var(--blue); font-weight: 600; }

}
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; font-weight: 500; font-size: .88rem; }

.child-chip { display: inline-flex; align-items: center; gap: 8px; }

.notif { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line-2); align-items: flex-start; }

function defaultGradeSettings(gid, f = 1) {
  const band = gradeBand(gid);

  const req = band === 'kg' ? { gender: 1, nationality: 1, homeArea: 1 } : { gender: 1, nationality: 1, previousSchool: 1, homeArea: 1 };
  const docs = band === 'kg' ? { birth_cert: 1, photo: 1, guardian_id: 1, vaccination: 1 } : band === 'primary' ? { birth_cert: 1, photo: 1, guardian_id: 1, prev_report: 0, vaccination: 0 } : { birth_cert: 1, photo: 1, guardian_id: 1, prev_report: 1, transfer_cert: 1 };

    gradeId: gid, applicationFee: r(base[0], 50), downPayment: r(base[1], 500),

    documents: Object.keys(DOC_LIB).map((k) => ({ key: k, label: DOC_LIB[k], enabled: k in docs, required: !!docs[k] })),

/* =========================================================================
   Business rules — every screen calls these; nothing below is duplicated in views.
   ========================================================================= */
function log(msg, o = {}) {
  const fromApp = o.appId && getApp(o.appId) ? sidOf(getApp(o.appId)) : null;
  st.audit.unshift({ id: 'l' + nextSeq('log'), at: st.now, by: o.by || adminName(), kind: o.kind || 'info', appId: o.appId || null, schoolId: o.schoolId || fromApp || ctxSid(), msg });
}
function setStatus(a, status, by, note) {
  a.status = status; a.updatedAt = st.now;
  a.statusHistory.push({ status, at: st.now, by, note: note || '' });
}
function addEvent(a, by, note) { a.updatedAt = st.now; a.statusHistory.push({ status: a.status, at: st.now, by, note, event: true }); }
function notify(a, type, title, message, key) {
  const k = key || `${type}:${a.id}:${st.now}:${a.statusHistory.length}`;
  if (st.notifications.some((n) => n.key === k)) return false; // one event, one notification
  st.notifications.unshift({ id: 'n' + nextSeq('notif'), parentId: a.parentId, applicationId: a.id, type, title, message, createdAt: st.now, readAt: null, key: k });
  return true;
}
function hasReached(a, status) { return a.statusHistory.some((h) => h.status === status && !h.event); }

/* --- cycles --- */
function cycleAccepting(c) {
  if (!c) return { ok: false, reason: 'Admission cycle not found.' };
  if (c.status === 'draft') return { ok: false, reason: 'This cycle hasn’t been published yet.' };
  if (c.status === 'closed') return { ok: false, reason: 'Applications are closed for this cycle.' };
  if (c.status === 'scheduled') return { ok: false, reason: `Applications open on ${fmtDate(c.openingDate)}.` };
  if (ms(st.now) < ms(c.openingDate)) return { ok: false, reason: `Applications open on ${fmtDate(c.openingDate)}.` };
  if (ms(st.now) > ms(c.deadline) + DAY - 60e3) return { ok: false, reason: `The application deadline (${fmtDate(c.deadline)}) has passed.` };
  return { ok: true };
}
function validateCycle(c) {
  const e = {};
  if (!c.name || !c.name.trim()) e.name = 'Enter a cycle name, for example “Main Intake 2026/2027”.';
  if (!c.academicYear) e.academicYear = 'Choose the academic year.';
  if (!c.openingDate) e.openingDate = 'Choose the date applications open.';
  if (!c.deadline) e.deadline = 'Choose the application deadline.';
  if (c.openingDate && c.deadline && ms(c.deadline) < ms(c.openingDate)) e.deadline = 'The deadline can’t be earlier than the opening date.';
  if (!c.grades.length) e.grades = 'Select at least one grade.';
  c.grades.forEach((g) => {
    const cap = Number(c.seatCapacityByGrade[g]);
    if (!Number.isInteger(cap) || cap < 1) e['seat_' + g] = 'Enter a whole number of seats (1 or more).';
    else if (c.id) {
      const s = seatStats(c.id, g);
      if (cap < s.enrolled + s.reserved) e['seat_' + g] = `${gradeName(g)} already has ${s.enrolled + s.reserved} seats taken (${s.enrolled} enrolled, ${s.reserved} held by offers). Capacity can’t be lower.`;
    }
  });
  if (c.id) {
    const removed = (getCycle(c.id).grades || []).filter((g) => !c.grades.includes(g));
    removed.forEach((g) => { if (st.applications.some((a) => a.cycleId === c.id && a.gradeId === g)) e.grades = `${gradeName(g)} already has applications in this cycle and can’t be removed.`; });
  }
  return e;
}

/* --- seats: one calculation used everywhere --- */
function seatStats(cycleId, gradeId) {
  const c = getCycle(cycleId);
  const capacity = Number((c && c.seatCapacityByGrade[gradeId]) || 0);
  const enrolled = st.students.filter((s) => s.cycleId === cycleId && s.gradeId === gradeId).length;
  const offers = st.offers.filter((o) => o.cycleId === cycleId && o.gradeId === gradeId);
  const reserved = offers.filter((o) => o.seatReservationStatus === 'reserved').length;
  const outstanding = offers.filter((o) => (o.status === 'sent' || o.status === 'accepted') && o.seatReservationStatus !== 'reserved').length;
  const activeOffers = offers.filter((o) => o.status === 'sent' || o.status === 'accepted').length;
  const waitlisted = st.applications.filter((a) => a.cycleId === cycleId && a.gradeId === gradeId && a.status === 'waitlisted').length;
  const available = Math.max(0, capacity - enrolled - reserved);
  return { capacity, enrolled, reserved, outstanding, activeOffers, available, waitlisted, over: enrolled + reserved > capacity };
}
function seatCheck(cycleId, gradeId, extra = 0) {
  const s = seatStats(cycleId, gradeId);
  if (s.available - extra > 0) return { ok: true, s };
  const taken = s.enrolled + s.reserved;
  return { ok: false, s, reason: `No seats available in ${gradeName(gradeId)}: ${taken} of ${s.capacity} taken (${s.enrolled} enrolled, ${s.reserved} held by active offers).` };
}
/* Seats a NEW applicant can still get: free seats minus anyone already waiting for them (FIFO). 0 = the grade is full. */
function openSeats(cycleId, gradeId) {
  const s = seatStats(cycleId, gradeId); const R = rulesOf(sidOfCycle(cycleId));
  return Math.max(0, R.waitlistPolicy === 'fifo' ? s.available - s.waitlisted : s.available);
}
function waitlistFor(cycleId, gradeId) {
  return st.applications.filter((a) => a.cycleId === cycleId && a.gradeId === gradeId && a.status === 'waitlisted').sort((x, y) => (x.waitlistRank || 999) - (y.waitlistRank || 999) || ms(x.waitlistedAt || x.updatedAt) - ms(y.waitlistedAt || y.updatedAt));
}
function waitlistPos(a) { return waitlistFor(a.cycleId, a.gradeId).findIndex((x) => x.id === a.id) + 1; }

/* --- transitions: allowed-from lists plus an explanation for every refusal --- */
const TRANSITIONS = {
  start_review: { label: 'Start review', from: ['submitted'] },
  schedule: { label: 'Schedule assessment', from: ['submitted', 'under_review', 'assessment_scheduled'] },
  outcome: { label: 'Record outcome', from: ['assessment_scheduled'] },
  to_decision: { label: 'Move to decision', from: ['under_review'] },
  accept: { label: 'Accept & issue offer', from: ['under_review', 'decision_pending'] },
  waitlist: { label: 'Waitlist', from: ['under_review', 'decision_pending'] },
  reject: { label: 'Reject', from: ['submitted', 'under_review', 'assessment_scheduled', 'decision_pending', 'waitlisted'] },
  promote: { label: 'Offer seat', from: ['waitlisted'] },
  request_docs: { label: 'Request documents', from: ['submitted', 'under_review', 'assessment_scheduled', 'decision_pending', 'waitlisted'] },
  enroll: { label: 'Confirm enrollment', from: ['down_payment_paid'] },
};
function checkAction(a, action, ctx = {}) {
  const t = TRANSITIONS[action];
  const s = a.status;
  const no = (reason) => ({ ok: false, reason });
  const full = (reason) => ({ ok: false, reason, code: 'full' });
  if (!t.from.includes(s)) {
    if (s === 'draft' || s === 'payment_pending') return no('The parent hasn’t paid the application fee, so the application isn’t submitted yet.');
    if (s === 'enrolled') return no('This applicant is already enrolled.');
    if (s === 'rejected') return no('This application was rejected. Rejected applicants can’t receive offers or further actions.');
    if (s === 'offer_expired') return no('The offer expired and its seat was released. This application is closed.');
    if (['offer_sent', 'offer_accepted', 'accepted'].includes(s)) return no('An offer is active. Wait for the parent to pay, or for the offer to expire.');
    if (s === 'down_payment_paid' && action !== 'enroll') return no('The down payment is paid. Confirm enrollment instead.');
    if (s === 'assessment_scheduled' && ['accept', 'waitlist', 'to_decision'].includes(action)) return no('Record the assessment outcome first.');
    if (s === 'waitlisted' && action === 'accept') return no('Waitlisted applicants receive offers through “Offer seat”, which checks seat availability and the waitlist order.');
    if (s === 'waitlisted') return no('The applicant is waitlisted. Offer a seat or reject instead.');
    if (s === 'submitted' && ['accept', 'waitlist', 'to_decision'].includes(action)) return no('Start the review before making a decision.');
    if (s === 'decision_pending' && action === 'schedule') return no('The assessment is complete. Make a decision instead.');
    if (s === 'under_review' && action === 'outcome') return no('No assessment is scheduled yet.');
    return no(`Not available while the application is “${STATUS[s].label}”.`);
  }
  if (a.feeStatus !== 'paid') return no('The application fee hasn’t been paid.');
  if (action === 'schedule' && s === 'assessment_scheduled' && a.assessment && a.assessment.outcome) return no('The outcome is already recorded.');
  if (action === 'accept') {
    const s2 = seatStats(a.cycleId, a.gradeId); const extra = ctx.extra || 0;
    if (openSeats(a.cycleId, a.gradeId) - extra <= 0) {
      if (s2.available - extra <= 0) return full(`${gradeName(a.gradeId)} is full: ${s2.enrolled + s2.reserved} of ${s2.capacity} seats taken (${s2.enrolled} enrolled, ${s2.reserved} held by active offers). The applicant joins the waitlist instead.`);
      return full(`${gradeName(a.gradeId)} has ${s2.available - extra} free seat${s2.available - extra === 1 ? '' : 's'}, but ${s2.waitlisted} applicant${s2.waitlisted === 1 ? ' is' : 's are'} already on its waitlist and get${s2.waitlisted === 1 ? 's' : ''} the seat first. The applicant joins the waitlist instead.`);
    }
  }
  if (action === 'promote') {
    const c = seatCheck(a.cycleId, a.gradeId, ctx.extra || 0);
    if (!c.ok) return no(c.reason + ' A seat must be released before promoting from the waitlist.');
    if (rulesOf(sidOf(a)).waitlistPolicy === 'fifo' && !ctx.ignoreOrder) {
      const first = waitlistFor(a.cycleId, a.gradeId)[ctx.position || 0];
      if (first && first.id !== a.id) return no(`FIFO waitlist: ${childName(first)} is ahead in line. Reorder the waitlist (with a reason) to change who is next.`);
    }
  }
  if (action === 'enroll') {
    if (studentOf(a)) return no('A student record already exists for this application.');
    const s2 = seatStats(a.cycleId, a.gradeId);
    if (s2.enrolled >= s2.capacity) return no(`${gradeName(a.gradeId)} is at capacity (${s2.capacity} enrolled).`);
  }
  return { ok: true };
}

/* --- admin actions --- */
function actStartReview(a) {
  setStatus(a, 'under_review', adminName(), 'Review started');
  notify(a, 'status_changed', 'Application under review', `The admissions team has started reviewing ${firstName(childName(a))}’s application.`);
}
function actToDecision(a, note) { setStatus(a, 'decision_pending', adminName(), note || 'Moved to decision without assessment'); }
function actSchedule(a, f) {
  const changed = !!(a.assessment && a.status === 'assessment_scheduled');
  a.assessment = Object.assign(a.assessment && changed ? a.assessment : {}, { type: f.type, date: f.date, time: f.time, location: f.location, instructions: f.instructions, notes: f.notes, outcome: null, outcomeNotes: '', updatedAt: st.now, changes: changed ? (a.assessment.changes || 0) + 1 : 0 });
  if (!changed) a.assessment.scheduledAt = st.now;
  const when = `${fmtDateW(f.date)} at ${f.time}`;
  if (changed) {
    addEvent(a, adminName(), `Assessment rescheduled · ${f.type}, ${when}`);
    notify(a, 'assessment_changed', `${f.type} rescheduled`, `${firstName(childName(a))}’s ${f.type.toLowerCase()} is now on ${when}, ${f.location}.`, `assess:${a.id}:${a.assessment.changes}:${f.date}${f.time}`);

  });

  const onBind = (e) => {
    const el = e.target.closest('[data-bind]');

  });

/* =========================================================================
   datepicker.js: typeable date-of-birth field.
   Type a full date (DD/MM/YYYY) or just a year; the calendar jumps to it.
   ========================================================================= */
ui.dp = ui.dp || {};
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WEEKDAYS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
const TYPICAL_AGE = { kg1: 4, kg2: 5, g1: 6, g2: 7, g3: 8, g4: 9, g5: 10, g6: 11, g7: 12, g8: 13, g9: 14 };
const isoDate = (y, m, d) => `${y}-${pad(m + 1, 2)}-${pad(d, 2)}`;
const isIso = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const toDMY = (iso) => (isIso(iso) ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '');
const daysIn = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();

/* Selectable range: yesterday back to the oldest date that keeps the child 18 or under. */
function dpBounds() {
  const max = dateOnly(addDays(st.now, -1));
  const ny = Number(st.now.slice(0, 4));
  const min = dateOnly(addDays(`${ny - 19}${st.now.slice(4, 10)}T00:00`, 1));
  return { min, max, minY: Number(min.slice(0, 4)), maxY: Number(max.slice(0, 4)), minM: Number(min.slice(5, 7)) - 1, maxM: Number(max.slice(5, 7)) - 1 };
}
function dpClampView(s, b) {
  if (s.y < b.minY) { s.y = b.minY; }
  if (s.y > b.maxY) { s.y = b.maxY; }
  if (s.y === b.minY && s.m < b.minM) s.m = b.minM;
  if (s.y === b.maxY && s.m > b.maxM) s.m = b.maxM;
}
function dpNav(s, b) {
  return { atMin: s.y < b.minY || (s.y === b.minY && s.m <= b.minM), atMax: s.y > b.maxY || (s.y === b.maxY && s.m >= b.maxM) };
}

/* Accepts 17/05/2020, 17-5-2020, 17.05.2020, 17052020, 2020-05-17; or a year (2020) / month+year (05/2020) to jump. */
function dpParse(text) {
  const t = String(text || '').trim();
  if (!t) return { empty: true };
  let m, y, mo, d;
  if ((m = t.match(/^(\d{1,2})\s*[/.\- ]\s*(\d{1,2})\s*[/.\- ]\s*(\d{4})$/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
  else if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = t.match(/^(\d{2})(\d{2})(\d{4})$/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
  if (y) {
    const ok = mo >= 1 && mo <= 12 && d >= 1 && d <= daysIn(y, mo - 1);
    return ok ? { date: isoDate(y, mo - 1, d), y, m: mo - 1 } : { invalid: true, y, m: mo >= 1 && mo <= 12 ? mo - 1 : null };
  }
  const yr = t.match(/(?:^|\D)(\d{4})(?!\d)/);
  if (yr) {
    const mm = t.match(/(?:^|\D)(\d{1,2})\s*[/.\- ]\s*\d{4}(?!\d)/);
    const mon = mm ? +mm[1] : 0;
    return { y: +yr[1], m: mon >= 1 && mon <= 12 ? mon - 1 : null };
  }
  return { partial: true };
}

function dpState(k, iso, a) {
  let s = ui.dp[k];
  const startY = Number(String(cycleOf(a).academicYear || '2026').slice(0, 4));
  const typical = startY - (TYPICAL_AGE[a.gradeId] ?? 6);
  if (!s) {
    const v = isIso(iso);
    s = ui.dp[k] = { open: false, text: v ? toDMY(iso) : '', value: v ? iso : '', y: v ? +iso.slice(0, 4) : typical, m: v ? +iso.slice(5, 7) - 1 : 0, msg: '', focus: null, appId: a.id };
  }
  s.gradeId = a.gradeId; s.typical = typical; s.startY = startY;
  if (!s.open && !s.value) { s.y = typical; s.m = 0; }
  dpClampView(s, dpBounds());
  return s;
}
const dpAge = (s) => (isIso(s.value) && s.value < dateOnly(st.now) ? `Age on 1 Oct ${s.startY}: ${ageOn(s.value, `${s.startY}-10-01`)} years.` : '');

function dpPopInner(k) {
  const s = ui.dp[k]; const id = k.split(':')[0]; const b = dpBounds(); const nav = dpNav(s, b);
  return `<div class="dp-head">
      <button type="button" class="dp-nav" data-act="dpStep" data-dp="${k}" data-step="-1" aria-label="Previous month" ${nav.atMin ? 'disabled' : ''}>${ic('chevL', 'flip')}</button>
      <label class="sr-only" for="dpm_${id}">Month</label>
      <select class="select dp-month" id="dpm_${id}" data-bind="dpMonth" data-dp="${k}">${MONTHS.map((n, i) => `<option value="${i}" ${i === s.m ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <label class="sr-only" for="dpy_${id}">Year</label>
      <input class="input dp-year" id="dpy_${id}" type="text" inputmode="numeric" maxlength="4" autocomplete="off" value="${s.y}" data-bind="dpYear" data-dp="${k}" aria-describedby="dpmsg_${id}">
      <button type="button" class="dp-nav" data-act="dpStep" data-dp="${k}" data-step="1" aria-label="Next month" ${nav.atMax ? 'disabled' : ''}>${ic('chevR', 'flip')}</button>
    </div>

    <div class="dp-foot"><button type="button" class="linkbtn small" data-act="dpTypical" data-dp="${k}">Jump to ${s.typical} (typical for ${esc(gradeName(s.gradeId))})</button><button type="button" class="btn btn-sm btn-ghost" data-act="dpClose" data-dp="${k}">Done</button></div>`;
}
function dpGrid(k) {
  const s = ui.dp[k]; const b = dpBounds();
  const start = new Date(Date.UTC(s.y, s.m, 1)).getUTCDay(); const n = daysIn(s.y, s.m);
  const ym = `${s.y}-${pad(s.m + 1, 2)}`;
  let focus = s.focus && s.focus.slice(0, 7) === ym ? s.focus : s.value && s.value.slice(0, 7) === ym ? s.value : null;
  if (!focus) for (let d = 1; d <= n; d++) { const iso = isoDate(s.y, s.m, d); if (iso >= b.min && iso <= b.max) { focus = iso; break; } }
  let cells = '';
  for (let i = 0; i < start; i++) cells += '<span></span>';
  for (let d = 1; d <= n; d++) {
    const iso = isoDate(s.y, s.m, d); const dis = iso < b.min || iso > b.max; const sel = iso === s.value;
    cells += `<button type="button" class="dp-day${sel ? ' sel' : ''}" data-act="dpPick" data-dp="${k}" data-date="${iso}" tabindex="${iso === focus ? 0 : -1}" aria-label="${fmtDateW(iso)}${sel ? ', selected' : ''}" ${dis ? 'disabled' : ''}>${d}</button>`;
  }
  return `<div class="dp-wd" aria-hidden="true">${WEEKDAYS.map((w) => `<span>${w}</span>`).join('')}</div><div class="dp-grid" role="group" aria-label="${MONTHS[s.m]} ${s.y}">${cells}</div>`;
}

/* Repaint the popover in place, so typing never loses focus or caret position. */
const dpWrap = (k) => document.querySelector(`[data-dpwrap="${k}"]`);
function dpPaint(k, opts = {}) {
  const w = dpWrap(k); const s = ui.dp[k]; if (!w || !s) return;
  const pop = w.querySelector('.dp-pop'); const input = w.querySelector('.dp-input'); const tb = w.querySelector('.dp-btn');
  pop.hidden = !s.open;
  input.setAttribute('aria-expanded', String(s.open)); tb.setAttribute('aria-expanded', String(s.open)); tb.setAttribute('aria-label', `${s.open ? 'Close' : 'Open'} calendar`);
  if (opts.syncInput) input.value = s.text;
  const age = w.querySelector('.dp-age'); if (age) age.textContent = dpAge(s);
  if (!s.open) { pop.dataset.shown = ''; return; }
  if (!pop.dataset.shown) { pop.dataset.shown = '1'; requestAnimationFrame(() => { try { pop.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ } }); }
  const b = dpBounds(); const nav = dpNav(s, b);
  pop.querySelector('[data-dpgrid]').innerHTML = dpGrid(k);
  pop.querySelector('.dp-month').value = String(s.m);
  const yi = pop.querySelector('.dp-year'); if (document.activeElement !== yi) yi.value = String(s.y);
  pop.querySelector('[data-step="-1"]').disabled = nav.atMin;
  pop.querySelector('[data-step="1"]').disabled = nav.atMax;
  pop.querySelector('.dp-msg').textContent = s.msg || '';
  const focusSel = opts.focusDay ? `.dp-day[data-date="${opts.focusDay}"]` : opts.focusGrid ? '.dp-day[tabindex="0"]' : null;

/* Open on click, close on outside click / focus leaving / Escape; arrow keys move between days. */
const dpOpenKeys = () => Object.keys(ui.dp).filter((k) => ui.dp[k].open);
document.addEventListener('click', (e) => {
  dpOpenKeys().forEach((k) => { const w = dpWrap(k); if (!w || !w.contains(e.target)) { ui.dp[k].open = false; dpPaint(k); } });
  const inp = e.target.closest && e.target.closest('.dp-input');
  if (inp) { const k = inp.dataset.dp; const s = ui.dp[k]; if (s && !s.open) { s.open = true; s.msg = ''; dpShowValue(s); dpClampView(s, dpBounds()); dpPaint(k); } }
});
document.addEventListener('focusin', (e) => {
  dpOpenKeys().forEach((k) => { const w = dpWrap(k); if (w && !w.contains(e.target)) { ui.dp[k].open = false; dpPaint(k); } });
});
document.addEventListener('keydown', (e) => {
  const t = e.target; if (!t || !t.matches) return;
  if (e.key === 'Escape') {
    const open = dpOpenKeys();
    if (open.length) { open.forEach((k) => { ui.dp[k].open = false; dpPaint(k); dpFocusInput(k); }); e.stopImmediatePropagation(); e.preventDefault(); }
    return;
  }
  if (t.matches('.dp-input') && e.key === 'ArrowDown') {
    const k = t.dataset.dp; const s = ui.dp[k]; if (!s) return;
    e.preventDefault(); s.open = true; dpShowValue(s); dpClampView(s, dpBounds()); dpPaint(k, { focusGrid: true }); return;
  }
  if (!t.matches('.dp-day')) return;
  const k = t.dataset.dp; const s = ui.dp[k]; const b = dpBounds(); const cur = t.dataset.date;
  const rtl = document.documentElement.dir === 'rtl';
  const byDays = (n) => dateOnly(addDays(`${cur}T00:00`, n));
  const byMonths = (n) => { let m = +cur.slice(5, 7) - 1 + n, y = +cur.slice(0, 4); y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return isoDate(y, m, Math.min(+cur.slice(8, 10), daysIn(y, m))); };
  const keys = { ArrowLeft: () => byDays(rtl ? 1 : -1), ArrowRight: () => byDays(rtl ? -1 : 1), ArrowUp: () => byDays(-7), ArrowDown: () => byDays(7), PageUp: () => byMonths(e.shiftKey ? -12 : -1), PageDown: () => byMonths(e.shiftKey ? 12 : 1), Home: () => `${cur.slice(0, 8)}01`, End: () => isoDate(+cur.slice(0, 4), +cur.slice(5, 7) - 1, daysIn(+cur.slice(0, 4), +cur.slice(5, 7) - 1)) };
  if (!keys[e.key]) return;
  e.preventDefault();
  let next = keys[e.key]();
  if (next < b.min) next = b.min; if (next > b.max) next = b.max;
  s.focus = next; s.y = +next.slice(0, 4); s.m = +next.slice(5, 7) - 1; s.msg = '';
  dpPaint(k, { focusDay: next });
});

    <div class="tabs" role="tablist">${Object.keys(groups).map((k) => `<button type="button" role="tab" aria-selected="${tab === k}" data-act="assessTab" data-tab="${k}">${labels[k]}<span class="count">${groups[k].length}</span></button>`).join('')}</div>
    <section class="card">${list.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Student</th><th>Grade</th><th>${tab === 'toschedule' ? 'Status' : 'Assessment'}</th><th>${tab === 'toschedule' ? 'Submitted' : 'When'}</th><th>${tab === 'done' ? 'Outcome' : ''}</th><th class="r">Actions</th></tr></thead><tbody>
      ${list.map((a) => `<tr><td>${appLink(a)}<div class="cell-sub">${esc(parentOf(a).fullName)}</div></td><td>${esc(gradeName(a.gradeId))}</td><td>${tab === 'toschedule' ? statusBadge(a.status) : esc(a.assessment.type)}<div class="cell-sub">${tab === 'toschedule' ? '' : esc(a.assessment.location)}</div></td><td class="small">${tab === 'toschedule' ? fmtDate(a.submittedAt) : `${fmtDateW(a.assessment.date)}, ${a.assessment.time}<div class="cell-sub">${relTime(`${a.assessment.date}T${a.assessment.time}`)}</div>`}</td>
        <td>${tab === 'done' ? esc(a.assessment.outcome) : ''}</td><td class="r"><div class="row" style="justify-content:flex-end">${tab === 'toschedule' ? actionBtn(a, 'schedule', 'Schedule', `data-act="schedule" data-id="${a.id}"`, 'btn-sm btn-primary') : tab === 'done' ? btn('Open', `data-go="a-app" data-id="${a.id}"`, 'btn-sm') : `${actionBtn(a, 'schedule', 'Reschedule', `data-act="schedule" data-id="${a.id}"`, 'btn-sm')}${actionBtn(a, 'outcome', 'Record outcome', `data-act="outcome" data-id="${a.id}"`, `btn-sm ${tab === 'outcome' ? 'btn-primary' : ''}`)}`}</div></td></tr>`).join('')}</tbody></table></div>` : `<div class="card-body">${emptyState('calendar', `Nothing ${labels[tab].toLowerCase()}`, tab === 'outcome' ? 'Outcomes appear here once an assessment date has passed. Advance the demo clock to simulate this.' : 'No applications in this group.')}</div>`}</section>` };
};
ACTS.assessTab = (el) => { ui.assessTab = el.dataset.tab; render(); };

/* ---------- decisions ---------- */
ADMIN_VIEWS['a-decisions'] = () => {
  const dp = SA().filter((a) => a.status === 'decision_pending');
  const rev = SA().filter((a) => a.status === 'under_review');
  const c = mainCycle(mySid());
  const row = (a) => `<tr><td>${appLink(a)}<div class="cell-sub">${a.reference}</div></td><td>${esc(gradeName(a.gradeId))}</td><td>${a.assessment && a.assessment.outcome ? badge({ label: a.assessment.outcome, tone: a.assessment.outcome.startsWith('Recommended') ? 'good' : 'crit', icon: a.assessment.outcome.startsWith('Recommended') ? 'check' : 'x' }) : '<span class="muted small">No assessment</span>'}</td><td class="small">${relTime(a.updatedAt)}</td>
    <td class="r"><div class="row" style="justify-content:flex-end">${actionBtn(a, 'accept', 'Accept & offer', `data-act="decide" data-action="accept" data-id="${a.id}" id="acc-${a.id}"`, 'btn-sm btn-primary')}${actionBtn(a, 'waitlist', 'Waitlist', `data-act="decide" data-action="waitlist" data-id="${a.id}"`, 'btn-sm')}${actionBtn(a, 'reject', 'Reject', `data-act="decide" data-action="reject" data-id="${a.id}"`, 'btn-sm btn-danger')}</div></td></tr>`;
  const table = (list, empty) => (list.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Student</th><th>Grade</th><th>Assessment outcome</th><th>Waiting</th><th class="r">Decision</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div>` : `<div class="card-body">${emptyState('checkCircle', empty, 'Nothing waiting here.')}</div>`);
  return { title: 'Decisions', crumb: 'Decisions', html: `${pageHead('Decisions', 'Accept, waitlist or reject. Accepting issues an offer with a deadline. If the grade is full, or others are already waiting for its free seats, the applicant joins the waitlist instead')}
    <div class="g3">${[...new Set([...dp, ...rev].filter((a) => a.cycleId === (c || {}).id).map((a) => a.gradeId))].sort((x, y) => ALL_GRADES.indexOf(x) - ALL_GRADES.indexOf(y)).map((g) => { const s = seatStats(c.id, g); return `<div class="card card-pad stack-sm"><div class="row-between"><h3>${esc(gradeName(g))}</h3><span class="small num"><b>${s.available}</b> of ${s.capacity} available</span></div>${seatBar(s)}<span class="xs muted">${s.enrolled} enrolled · ${s.reserved} held by offers · ${s.waitlisted} waitlisted</span></div>`; }).join('')}</div>
    <section class="card"><div class="card-head"><h2>Decision pending</h2><span class="pill-count">${dp.length}</span></div>${table(dp, 'No decisions pending')}</section>
    <section class="card"><div class="card-head"><h2>In review</h2><span class="xs muted">Decide directly or schedule an assessment first</span></div>${table(rev, 'No applications in review')}</section>` };
};

/* ---------- offers & enrollment ---------- */
ADMIN_VIEWS['a-offers'] = () => {
  const act = (o) => o.status === 'sent' || o.status === 'accepted';
  const left = (o) => ms(o.deadline) - ms(st.now);
  const tabs = {
    active: SO().filter(act).sort((x, y) => left(x) - left(y)),
    soon: SO().filter((o) => act(o) && left(o) > 0 && left(o) <= aRules().warnDays * DAY),
    overdue: SO().filter((o) => act(o) && left(o) <= 0),
    paid: SO().filter((o) => o.status === 'paid' && aApp(o.applicationId).status === 'down_payment_paid'),
    expired: SO().filter((o) => o.status === 'expired'),
    enrolled: SO().filter((o) => o.status === 'paid' && studentOf(aApp(o.applicationId))),
  };
  const labels = { active: 'Active', soon: 'Expiring soon', overdue: 'Past deadline', paid: 'Paid · awaiting enrollment', expired: 'Expired', enrolled: 'Enrolled' };
  const tab = ui.offersTab in tabs ? ui.offersTab : 'active'; const list = tabs[tab];
  const accepted = SA().filter((a) => a.status === 'accepted' && !a.offerId);
  return { title: 'Offers & enrollment', crumb: 'Offers & enrollment', html: `${pageHead('Offers & enrollment', `Offers expire ${aRules().autoExpire ? 'automatically' : 'manually'} when the down payment isn’t paid by the deadline. Enrollment is ${aRules().enrollment === 'auto' ? 'created automatically once the offer is accepted and paid' : 'confirmed by staff after payment'}.`, assume())}
    ${accepted.length ? `<div class="callout">${ic('info')}<div>${accepted.length} accepted applicant${accepted.length > 1 ? 's' : ''} without an offer.</div></div>` : ''}
    <div class="tabs" role="tablist">${Object.keys(tabs).map((k) => `<button type="button" role="tab" aria-selected="${tab === k}" data-act="offersTab" data-tab="${k}">${labels[k]}<span class="count">${tabs[k].length}</span></button>`).join('')}</div>
    <section class="card">${list.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Offer</th><th>Student</th><th>Grade</th><th>Deadline</th><th class="r">Down payment</th><th>Parent</th><th>Seat</th><th class="r">Actions</th></tr></thead><tbody>
      ${list.map((o) => { const a = aApp(o.applicationId); const l = left(o); return `<tr><td class="mono small">${o.reference}<div class="cell-sub">Issued ${fmtDate(o.issuedAt)}</div></td><td>${appLink(a)}</td><td>${esc(gradeName(o.gradeId))}</td>
        <td class="small">${fmtDT(o.deadline)}${act(o) ? `<div class="cell-sub" style="${l <= aRules().warnDays * DAY ? 'color:var(--crit);font-weight:600' : ''}">${l <= 0 ? 'Past deadline' : timeLeft(o.deadline)}</div>` : ''}</td><td class="r num">${egp(o.downPayment)}</td>
        <td>${offerBadge(o.status)}${o.acceptedAt ? `<div class="cell-sub">Accepted ${fmtDate(o.acceptedAt)}</div>` : ''}</td><td class="small">${esc(SEAT_RES[o.seatReservationStatus])}</td>
        <td class="r"><div class="row" style="justify-content:flex-end">${act(o) ? `${btn('Deadline', `data-act="deadline" data-id="${o.id}"`, 'btn-sm')}${l <= 0 ? btn('Expire', `data-act="expire" data-id="${o.id}" id="expire-${o.id}"`, 'btn-sm btn-danger') : ''}` : ''}${tab === 'paid' ? actionBtn(a, 'enroll', 'Confirm enrollment', `data-act="enroll" data-id="${a.id}"`, 'btn-sm btn-primary') : ''}${btn('Open', `data-go="a-app" data-id="${a.id}"`, 'btn-sm btn-ghost')}</div></td></tr>`; }).join('')}</tbody></table></div>` : `<div class="card-body">${emptyState('mail', `No ${labels[tab].toLowerCase()} offers`, tab === 'overdue' ? (aRules().autoExpire ? 'Automatic expiry is on, so overdue offers expire as soon as the deadline passes.' : 'None right now.') : 'Nothing in this group.')}</div>`}</section>
    ${SO().find((o) => o.applicationId === 'a12') ? `<div class="callout neutral">${ic('clock')}<div>To demonstrate expiry, advance the demo clock past an offer’s deadline. Seif Omar’s Grade 7 offer is due ${fmtDT(SO().find((o) => o.applicationId === 'a12').deadline)}.</div></div>` : `<div class="callout neutral">${ic('clock')}<div>To demonstrate expiry, advance the demo clock past an offer’s deadline.</div></div>`}` };
};
ACTS.offersTab = (el) => { ui.offersTab = el.dataset.tab; render(); };

/* ---------- seats & waitlist ---------- */
ADMIN_VIEWS['a-seats'] = () => {
  const c = getCycle(ui.seatsCycle) || mainCycle(mySid());
  const trail = SAUD().filter((l) => ['waitlist', 'seat'].includes(l.kind) && (!l.appId || (aApp(l.appId) || {}).cycleId === c.id)).slice(0, 12);
  return { title: 'Seats & waitlist', crumb: 'Seats & waitlist', html: `${pageHead('Seats & waitlist', 'Available = capacity − enrolled − seats held by active offers. Confirmed enrollments can never exceed capacity.', assume('FIFO waitlist'))}
    <div class="filters">${selectField({ id: 'seat-cycle', label: 'Admission cycle', value: c.id, placeholder: null, options: cycleOpts(false), attrs: 'data-bind="seatsCycle"' })}</div>
    ${seatLegend()}
    <div class="stack">${c.grades.filter((g) => gradeActive(Object.assign({ cycleId: c.id, gradeId: g }, seatStats(c.id, g)), SA())).map((g) => {
      const s = seatStats(c.id, g); const wl = waitlistFor(c.id, g);
      return `<section class="card" aria-labelledby="sg-${g}"><div class="card-head"><h2 id="sg-${g}">${esc(gradeName(g))}</h2><div class="row">${s.over ? badge({ label: 'Over-allocated', tone: 'crit', icon: 'alert' }) : s.available ? badge({ label: `${s.available} available`, tone: 'good', icon: 'check' }) : badge({ label: 'Full', tone: 'serious', icon: 'seats' })}${s.available > 0 && wl.length ? btn(`${ic('arrowUp')}Offer seat to next in line`, `data-act="promote" data-id="${wl[0].id}" id="promote-next-${g}"`, 'btn-sm btn-primary') : ''}</div></div>
        <div class="card-body stack">${seatBar(s)}<div class="seatnums" style="grid-template-columns:repeat(5,minmax(0,1fr))"><div><b>${s.capacity}</b><span>Capacity</span></div><div><b>${s.enrolled}</b><span><i style="background:var(--seat-enrolled)"></i>Enrolled</span></div><div><b>${s.reserved}</b><span><i style="background:var(--seat-reserved)"></i>Held by offers</span></div><div><b>${s.available}</b><span><i style="background:var(--seat-free);border:1px solid var(--line)"></i>Available</span></div><div><b>${s.waitlisted}</b><span>Waitlisted</span></div></div>
          ${s.outstanding ? `<p class="small muted">${s.outstanding} offer${s.outstanding > 1 ? 's' : ''} sent without a held seat (seat confirmed on payment).</p>` : ''}
          <div><h3 style="margin-bottom:6px">Waitlist</h3>${wl.length ? `<div class="card" style="box-shadow:none">${wl.map((a, i) => { const pc = checkAction(a, 'promote', { ignoreOrder: aRules().waitlistPolicy === 'manual' }); return `<div class="wl-item ${i === 0 ? 'next' : ''}"><span class="wl-pos">${i + 1}</span><div style="min-width:0"><div class="cell-main">${appLink(a)}</div><div class="cell-sub">Waitlisted ${fmtDate(a.waitlistedAt || a.updatedAt)}${a.assessment && a.assessment.outcome ? ` · ${esc(a.assessment.outcome)}` : ''}${i === 0 ? ' · next in line' : ''}</div></div>
            <div class="row">${btn(ic('arrowUp'), `data-act="moveWl" data-id="${a.id}" data-dir="-1" aria-label="Move ${esc(childName(a))} up" ${i === 0 ? 'disabled' : ''}`, 'btn-sm btn-ghost')}${btn(ic('arrowDown'), `data-act="moveWl" data-id="${a.id}" data-dir="1" aria-label="Move ${esc(childName(a))} down" ${i === wl.length - 1 ? 'disabled' : ''}`, 'btn-sm btn-ghost')}
            ${pc.ok && (i === 0 || aRules().waitlistPolicy === 'manual') ? btn('Offer seat', `data-act="promote" data-id="${a.id}"`, 'btn-sm btn-primary') : disabledBtn('Offer seat', i > 0 && aRules().waitlistPolicy === 'fifo' ? `FIFO waitlist: ${childName(wl[0])} is ahead in line. Reorder the waitlist (with a reason) to change who is next.` : (pc.reason || 'No seat available.'), 'btn-sm')}</div></div>`; }).join('')}</div>` : '<p class="muted small">No one is waitlisted for this grade.</p>'}</div>
        </div></section>`;
    }).join('')}
    ${(() => { const quiet = c.grades.filter((g) => !gradeActive(Object.assign({ cycleId: c.id, gradeId: g }, seatStats(c.id, g)), SA())); return quiet.length ? `<section class="card" aria-labelledby="h-quiet"><div class="card-head"><h2 id="h-quiet">Grades with no applicants yet</h2><span class="xs muted">${quiet.length} grades · all places open</span></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Grade</th><th class="r">Capacity</th><th class="r">Available</th><th>Status</th></tr></thead><tbody>${quiet.map((g) => { const s = seatStats(c.id, g); return `<tr><td class="cell-main">${esc(gradeName(g))}</td><td class="r num">${s.capacity}</td><td class="r num">${s.available}</td><td>${badge({ label: 'Open', tone: 'good', icon: 'check' })}</td></tr>`; }).join('')}</tbody></table></div></section>` : ''; })()}</div>
    <section class="card" aria-labelledby="h-trail"><div class="card-head"><h2 id="h-trail">Seat and waitlist audit trail</h2></div><div class="card-body">${activityList(trail)}</div></section>` };
};
BINDS.seatsCycle = (el) => { ui.seatsCycle = el.value; render(); };

/* ---------- payments ---------- */
ADMIN_VIEWS['a-payments'] = () => {
  const f = ui.pay; const m = metrics({ cycle: 'all', range: 'all' });
  let rows = SPAY().filter((p) => (f.type === 'all' || p.paymentType === f.type) && (f.status === 'all' || p.status === f.status));
  if (f.q.trim()) { const q = f.q.trim().toLowerCase(); rows = rows.filter((p) => { const a = aApp(p.applicationId); return [p.transactionReference, a.reference, childName(a), parentOf(a).fullName].some((x) => x.toLowerCase().includes(q)); }); }
  rows.sort((x, y) => ms(y.createdAt) - ms(x.createdAt));
  const total = rows.filter((p) => p.status === 'succeeded').reduce((t, p) => t + p.amount, 0);
  return { title: 'Payments', crumb: 'Payments', html: `${pageHead('Payments and fee collection', 'Simulated Klickit Pay transactions. Application fees and down payments are separate transactions; failed and pending payments are never counted as collected.')}
    <div class="kpis k4">
      ${kpi('Application fees collected', egp(m.feesCollected), `${SPAY().filter((p) => p.paymentType === 'application_fee' && p.status === 'succeeded').length} payments`, 'card', 'money')}
      ${kpi('Down payments collected', egp(m.dpCollected), `${SPAY().filter((p) => p.paymentType === 'down_payment' && p.status === 'succeeded').length} payments`, 'wallet', 'money')}
      ${kpi('Pending', egp(m.pendingAmt), `${m.counts.pending} awaiting confirmation`, 'clock', 'money')}
      ${kpi('Failed', egp(m.failedAmt), `${m.counts.failed} declined · not counted`, 'x', 'money')}
    </div>
    <div class="card card-pad"><div class="filters">
      <div class="field search"><label for="pay-q">Search</label><div class="input-icon">${ic('search')}<input class="input" id="pay-q" placeholder="Transaction, application or name" value="${esc(f.q)}" data-bind="payF" data-key="q"></div></div>
      ${selectField({ id: 'pay-type', label: 'Type', value: f.type, placeholder: null, options: [['all', 'All types'], ['application_fee', 'Application fee'], ['down_payment', 'Down payment']], attrs: 'data-bind="payF" data-key="type"' })}
      ${selectField({ id: 'pay-status', label: 'Status', value: f.status, placeholder: null, options: [['all', 'All statuses'], ['succeeded', 'Succeeded'], ['pending', 'Pending'], ['failed', 'Failed'], ['cancelled', 'Superseded']], attrs: 'data-bind="payF" data-key="status"' })}
    </div></div>
    <section class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>Transaction</th><th>Date</th><th>Student</th><th>Type</th><th>Method</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>
      ${rows.map((p) => { const a = aApp(p.applicationId); return `<tr class="clickable" data-go="a-app" data-id="${a.id}" tabindex="0"><td class="mono small">${p.transactionReference}</td><td class="small">${fmtDT(p.createdAt)}</td><td><div class="cell-main">${esc(childName(a))}</div><div class="cell-sub mono">${a.reference}</div></td><td>${esc(PAY_TYPE[p.paymentType])}</td><td class="small">${esc(METHODS[p.method] || p.method)}</td><td class="r num">${egp(p.amount)}</td><td>${payBadge(p.status)}</td></tr>`; }).join('')}
    </tbody></table></div>${rows.length ? '' : emptyState('card', 'No payments match', 'Try another filter.')}<div class="pager"><span>${rows.length} transactions</span><span>Succeeded in this view: <b class="num">${egp(total)}</b></span></div></section>` };
};
BINDS.payF = (el) => { ui.pay[el.dataset.key] = el.value; render(); };

/* ---------- analytics ---------- */
ADMIN_VIEWS['a-analytics'] = () => {
  const cyc = ui.analyticsCycle; const m = metrics({ cycle: cyc, range: 'all' });
  const decided = m.apps.filter((a) => a.decision && a.submittedAt);
  const avgDays = decided.length ? Math.round(decided.reduce((t, a) => t + (ms(a.decision.at) - ms(a.submittedAt)) / DAY, 0) / decided.length) : 0;
  const offersAll = SO().filter((o) => cyc === 'all' || o.cycleId === cyc);
  const offStat = { sent: 0, accepted: 0, paid: 0, expired: 0 }; offersAll.forEach((o) => { offStat[o.status]++; });
  const grades = m.byGrade.filter((g) => g.total > 0).map((g) => {
    const apps = m.apps.filter((a) => a.gradeId === g.gradeId);
    const fees = SPAY().filter((p) => p.status === 'succeeded' && apps.some((a) => a.id === p.applicationId));
    return { ...g, submitted: apps.filter((a) => a.submittedAt).length, offers: apps.filter((a) => a.offerId).length, waitlisted: apps.filter((a) => a.status === 'waitlisted').length, rejected: apps.filter((a) => a.status === 'rejected').length, fee: fees.filter((p) => p.paymentType === 'application_fee').reduce((t, p) => t + p.amount, 0), dp: fees.filter((p) => p.paymentType === 'down_payment').reduce((t, p) => t + p.amount, 0) };
  });
  const conv = m.funnel[1][1] ? Math.round((m.funnel[6][1] / m.funnel[1][1]) * 100) : 0;
  return { title: 'Analytics', crumb: 'Analytics', html: `${pageHead('Admissions analytics', 'Conversion, timing and collections per grade, from the same records as the dashboard.')}
    <div class="filters">${selectField({ id: 'an-cycle', label: 'Admission cycle', value: cyc, placeholder: null, options: cycleOpts(), attrs: 'data-bind="anCycle"' })}</div>
    <div class="kpis k4">
      ${kpi('Submitted → enrolled', `${conv}%`, `${m.funnel[6][1]} of ${m.funnel[1][1]} submitted`, 'cap')}
      ${kpi('Avg. days to decision', avgDays, `${decided.length} decided applications`, 'clock')}
      ${kpi('Offer acceptance', offersAll.length ? `${Math.round(((offStat.accepted + offStat.paid) / offersAll.length) * 100)}%` : '—', `${offStat.paid} paid · ${offStat.accepted} accepted · ${offStat.sent} awaiting · ${offStat.expired} expired`, 'mail')}
      ${kpi('Total collected', egp(m.feesCollected + m.dpCollected), 'Fees + down payments', 'card', 'money')}
    </div>
    <div class="g2">
      <section class="card"><div class="card-head"><h2>Admission funnel</h2></div><div class="card-body stack-sm">${funnelChart(m.funnel)}${dataTable(['Stage', 'Applications'], m.funnel)}</div></section>
      <section class="card"><div class="card-head"><h2>Offer outcomes</h2></div><div class="card-body stack-sm">${hbars([{ label: 'Paid', value: offStat.paid, icon: 'check', color: 'var(--s1)' }, { label: 'Accepted, unpaid', value: offStat.accepted, icon: 'clock', color: 'var(--s1)' }, { label: 'Awaiting parent', value: offStat.sent, icon: 'mail', color: 'var(--s1)' }, { label: 'Expired', value: offStat.expired, icon: 'x', color: 'var(--s1)' }])}</div></section>
    </div>
    <section class="card"><div class="card-head"><h2>By grade</h2></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Grade</th><th class="r">Applications</th><th class="r">Submitted</th><th class="r">Offers</th><th class="r">Enrolled</th><th class="r">Waitlisted</th><th class="r">Rejected</th><th class="r">Fees collected</th><th class="r">Down payments</th><th class="r">Seats left</th></tr></thead><tbody>
      ${grades.map((g) => { const s = m.seats.filter((x) => x.gradeId === g.gradeId).reduce((t, x) => t + x.available, 0); return `<tr><td class="cell-main">${esc(g.name)}</td><td class="r num">${g.total}</td><td class="r num">${g.submitted}</td><td class="r num">${g.offers}</td><td class="r num">${g.enrolled}</td><td class="r num">${g.waitlisted}</td><td class="r num">${g.rejected}</td><td class="r num">${egp(g.fee)}</td><td class="r num">${egp(g.dp)}</td><td class="r num">${s}</td></tr>`; }).join('')}
    </tbody></table></div></section>
    <section class="card"><div class="card-head"><h2>Applications by status</h2></div><div class="card-body">${hbars(STATUS_ORDER.filter((s) => m.byStatus[s]).map((s) => ({ label: STATUS[s].label, value: m.byStatus[s], icon: STATUS[s].icon })))}</div></section>` };
};
BINDS.anCycle = (el) => { ui.analyticsCycle = el.value; render(); };

/* ---------- students ---------- */
ADMIN_VIEWS['a-students'] = () => {
  const q = ui.studentsQ.trim().toLowerCase();
  const rows = SSTU().filter((s) => !q || [s.reference, s.studentName, s.applicationReference, getParent(s.parentId).fullName].some((x) => x.toLowerCase().includes(q))).sort((x, y) => ms(y.enrollmentDate) - ms(x.enrollmentDate));
  return { title: 'Enrolled students', crumb: 'Enrolled students', html: `${pageHead('Enrolled students', 'Student records created when an offer is accepted and its down payment is paid. In this demo they are simulated Klickit student records.')}
